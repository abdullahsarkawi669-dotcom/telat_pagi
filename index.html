<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Pencatatan Keterlambatan Santri & Wali Kelas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app-container {
      max-width: 1350px;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 28px 30px;
      box-shadow: 0 20px 40px rgba(0,20,50,0.08);
      height: fit-content;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #0b2b4a;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 i { color: #2a7de1; }
    .login-box {
      background: #eef3fa;
      border-radius: 30px;
      padding: 15px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 18px;
      margin-bottom: 25px;
    }
    .login-box label { font-weight: 500; color: #1a3a5c; }
    .login-box input, .login-box select {
      border: none;
      background: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 14px;
      min-width: 180px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      outline: none;
    }
    .login-box button {
      background: #1f4e8c;
      border: none;
      color: white;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-box button:hover { background: #133b66; }
    .login-status {
      margin-left: auto;
      font-size: 14px;
      color: #1e6b3b;
      background: #d9f0e3;
      padding: 4px 18px;
      border-radius: 40px;
    }
    .network-status {
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 20px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .net-online { background: #d9f0e3; color: #1e6b3b; }
    .net-offline { background: #fae3d9; color: #a94442; }

    .form-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      background: #f9fcff;
      padding: 20px;
      border-radius: 24px;
      margin: 20px 0;
      border: 1px solid #e4ecf5;
    }
    @media (max-width: 900px) {
      .form-section { grid-template-columns: 1fr; }
    }
    .card-box {
      background: white;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid #d0ddee;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-box h3 {
      font-size: 16px;
      color: #1b3b5c;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: #335577;
    }
    .input-group input, .input-group select {
      padding: 10px 14px;
      border-radius: 30px;
      border: 1px solid #d0ddee;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .suggestion-list {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-height: 180px;
      overflow-y: auto;
      position: absolute;
      width: 100%;
      top: 100%;
      z-index: 10;
      margin-top: 4px;
      border: 1px solid #e0eaf5;
      display: none;
    }
    .suggestion-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid #f0f4fa;
    }
    .suggestion-item:hover { background: #eaf1fb; }
    .btn-primary {
      background: #1f4e8c;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-primary:hover { background: #133b66; }
    .toolbar-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
    }
    .table-wrapper {
      overflow-x: auto;
      border-radius: 20px;
      border: 1px solid #e4ecf5;
      margin: 15px 0;
      background: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      background: #f2f8ff;
      color: #1b3b5c;
      padding: 14px 12px;
      text-align: left;
      border-bottom: 2px solid #d7e3f0;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid #e9eff6;
    }
    .badge {
      background: #dce8f8;
      color: #1f4e8c;
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-wali {
      background: #fae3d9;
      color: #8c2a1f;
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
    }
    .stat {
      font-size: 14px;
      color: #1d3d61;
      background: #eaf2fc;
      padding: 4px 18px;
      border-radius: 30px;
    }
  </style>
</head>

<div class="app-container" id="app">
  <h1>
    <i class="fas fa-clock"></i> Pencatatan Keterlambatan Santri & Wali Kelas
    <span id="netBadge" class="network-status net-online" style="margin-left:auto;"><i class="fas fa-wifi"></i> Online</span>
  </h1>

  <!-- LOGIN -->
  <div class="login-box" id="loginArea">
    <label><i class="fas fa-user"></i> User</label>
    <select id="usernameSelect">
      <option value="">-- Pilih User --</option>
      <option value="Agus Sarkawi">Agus Sarkawi</option>
      <option value="Ali Sulistiono">Ali Sulistiono</option>
      <option value="Arsyad">Arsyad</option>
      <option value="Adi Hardiyansyah">Adi Hardiyansyah</option>
      <option value="Jumadil">Jumadil</option>
      <option value="Junaidi">Junaidi</option>
      <option value="Budiman">Budiman</option>
    </select>
    <label><i class="fas fa-lock"></i> Password</label>
    <input type="password" id="passwordInput" placeholder="password...">
    <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
    <span class="login-status" id="loginStatus"><i class="fas fa-circle" style="color:#b0c6dd;font-size:10px;"></i> Belum login</span>
  </div>

  <!-- FORM INPUT -->
  <div class="form-section">
    <!-- Card 1: Santri -->
    <div class="card-box">
      <h3><i class="fas fa-user-graduate" style="color:#2a7de1;"></i> Form Santri Terlambat</h3>
      <div class="input-group">
        <label>Cari & Pilih Nama Santri</label>
        <input type="text" id="searchSantriInput" placeholder="Ketik nama santri..." autocomplete="off">
        <div id="suggestionBox" class="suggestion-list"></div>
      </div>
      <button class="btn-primary" id="addSantriDelayBtn" style="margin-top:auto;"><i class="fas fa-check"></i> Catat Santri Telat</button>
    </div>

    <!-- Card 2: Wali Kelas -->
    <div class="card-box">
      <h3><i class="fas fa-chalkboard-teacher" style="color:#d9534f;"></i> Form Wali Kelas Terlambat</h3>
      <div class="input-group">
        <label>Pilih Wali Kelas Terlambat</label>
        <select id="waliKelasSelect">
          <option value="-">-- Pilih Wali Kelas --</option>
          <option value="Hairul Umam Insani, S. Pd. (7a)">Hairul Umam Insani, S. Pd. (7a)</option>
          <option value="Hafiz Bagis, Lc. (7b)">Hafiz Bagis, Lc. (7b)</option>
          <option value="Salman, S. Pd. I. (7c)">Salman, S. Pd. I. (7c)</option>
          <option value="Haqikahurrahman, S. Pd. (7d)">Haqikahurrahman, S. Pd. (7d)</option>
          <option value="Zulkarnaen Teguh Wibowo, S. Pd. I. (7e)">Zulkarnaen Teguh Wibowo, S. Pd. I. (7e)</option>
          <option value="Firman, S. Pd. (8a)">Firman, S. Pd. (8a)</option>
          <option value="Syahrul Hasyim, Lc. (8b)">Syahrul Hasyim, Lc. (8b)</option>
          <option value="Adiandri Suhaili, M. Pd. (8c)">Adiandri Suhaili, M. Pd. (8c)</option>
          <option value="M. Tahir, M. Pd. (8d)">M. Tahir, M. Pd. (8d)</option>
          <option value="Ahmad Mahsan Haikal, Lc. (8e)">Ahmad Mahsan Haikal, Lc. (8e)</option>
          <option value="Saifuddin Hidayat, S. Pd. (9a)">Saifuddin Hidayat, S. Pd. (9a)</option>
          <option value="Syamsul Bahri, Lc. (9b)">Syamsul Bahri, Lc. (9b)</option>
          <option value="Ludfi Rusdiyono, S. Pd. (9c)">Ludfi Rusdiyono, S. Pd. (9c)</option>
          <option value="Ahmad Arroiyan, Lc. (9d)">Ahmad Arroiyan, Lc. (9d)</option>
        </select>
      </div>
      <button class="btn-primary" id="addWaliDelayBtn" style="margin-top:auto; background:#c9302c;"><i class="fas fa-check"></i> Catat Wali Kelas Telat</button>
    </div>
  </div>

  <div class="toolbar-actions">
    <span class="stat"><i class="fas fa-users"></i> Total tercatat: <span id="totalCount">0</span></span>
    <div style="display:flex; gap:10px;">
      <button class="btn-primary" id="exportXLSBtn" style="background:#1f8c5a;"><i class="fas fa-file-excel"></i> Download XLS</button>
      <button class="btn-primary" id="refreshBtn" style="background:#527a9e;"><i class="fas fa-sync"></i> Refresh Data</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Kategori</th>
          <th>Nama (Santri / Wali Kelas)</th>
          <th>Kelas</th>
          <th>Tanggal & Waktu</th>
          <th>Pencatat</th>
          <th>Status (Frekuensi)</th>
        </tr>
      </thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </div>
</div>

  let currentUser = null;
  let records = [];

  const usernameSelect = document.getElementById('usernameSelect');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginStatus = document.getElementById('loginStatus');
  const netBadge = document.getElementById('netBadge');
  
  const searchInput = document.getElementById('searchSantriInput');
  const suggestionBox = document.getElementById('suggestionBox');
  const addSantriDelayBtn = document.getElementById('addSantriDelayBtn');
  
  const waliKelasSelect = document.getElementById('waliKelasSelect');
  const addWaliDelayBtn = document.getElementById('addWaliDelayBtn');
  
  const recordsBody = document.getElementById('recordsBody');
  const totalCount = document.getElementById('totalCount');
  const exportBtn = document.getElementById('exportXLSBtn');
  const refreshBtn = document.getElementById('refreshBtn');

  function authenticate(username, password) {
    if (!username) return false;
    const days = ['ahad', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
    const todayName = days[new Date().getDay()]; 
    const dynamicPass = todayName + '212';
    return password.toLowerCase() === dynamicPass.toLowerCase();
  }

  function parseSantri(full) {
    const match = full.match(/^(.*?)\s*\(([^)]+)\)$/);
    if (match) {
      return { nama: match[1].trim(), kelas: match[2].trim() };
    }
    return { nama: full.trim(), kelas: '-' };
  }

  async function loadRecords() {
    if (!navigator.onLine) {
      updateNetworkStatus(false);
      loadFromLocalStorage();
      return;
    }

    try {
      const response = await fetch(`${API_URL}?action=get`);
      const result = await response.json();
      if (result.success && Array.isArray(result.data)) {
        records = result.data;
        localStorage.setItem('cached_records', JSON.stringify(records));
        updateTable();
        updateNetworkStatus(true);
        processPendingQueue();
      }
    } catch (e) {
      updateNetworkStatus(false);
      loadFromLocalStorage();
    }
  }

  function loadFromLocalStorage() {
    const cached = localStorage.getItem('cached_records');
    if (cached) {
      records = JSON.parse(cached);
      updateTable();
    }
  }

  function updateNetworkStatus(isOnline) {
    if (isOnline) {
      netBadge.className = 'network-status net-online';
      netBadge.innerHTML = '<i class="fas fa-wifi"></i> Online';
    } else {
      netBadge.className = 'network-status net-offline';
      netBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Offline (Mode Lokal)';
    }
  }

  async function processPendingQueue() {
    let queue = JSON.parse(localStorage.getItem('pending_queue') || '[]');
    if (queue.length === 0) return;

    netBadge.innerHTML = '<i class="fas fa-sync fa-spin"></i> Mensinkronkan...';
    
    for (let i = 0; i < queue.length; i++) {
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(queue[i])
        });
      } catch (err) {
        return;
      }
    }

    localStorage.removeItem('pending_queue');
    loadRecords();
  }

  window.addEventListener('online', () => {
    updateNetworkStatus(true);
    processPendingQueue();
  });
  window.addEventListener('offline', () => updateNetworkStatus(false));

  async function sendData(payload) {
    if (navigator.onLine) {
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert('Data berhasil dicatat & dikirim ke Server!');
        setTimeout(loadRecords, 1500);
        return;
      } catch (e) {}
    }

    let queue = JSON.parse(localStorage.getItem('pending_queue') || '[]');
    queue.push(payload);
    localStorage.setItem('pending_queue', JSON.stringify(queue));
    
    alert('Anda sedang Offline. Data disimpan di memori browser dan akan otomatis tersinkron saat terhubung internet.');
    loadRecords();
  }

  // Fungsi Mapping Tampilan Tabel yang Disempurnakan
  function updateTable() {
    recordsBody.innerHTML = '';
    totalCount.textContent = records.length;
    if (records.length === 0) {
      recordsBody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:#7a94b5;">Belum ada data tercatat</td></tr>`;
      return;
    }

    records.slice().reverse().forEach((r) => {
      const tr = document.createElement('tr');
      
      // Deteksi kategori berdasarkan properti data dari sheet masing-masing
      const isWali = r.category === 'wali' || r['Nama Wali Kelas'] !== undefined;
      
      const catBadge = isWali ? '<span class="badge-wali">Wali Kelas</span>' : '<span class="badge">Santri</span>';
      const nameText = isWali ? (r['Nama Wali Kelas'] || '-') : (r['Nama'] || '-');
      const kelasText = r['Kelas'] || '-';
      const timeText = `${r['Tanggal'] || ''} ${r['Waktu'] || ''}`;
      const pencatat = r['Pencatat'] || r['Dicatat Oleh'] || 'system';
      const statusCount = r['Status'] || '1';

      tr.innerHTML = `
        <td>${catBadge}</td>
        <td><strong>${nameText}</strong></td>
        <td>${kelasText}</td>
        <td>${timeText}</td>
        <td>${pencatat}</td>
        <td><span style="font-weight:bold; color:#1f4e8c;">Telat ke-${statusCount}</span></td>
      `;
      recordsBody.appendChild(tr);
    });
  }

  function showSuggestions(query) {
    if (!query.trim()) { suggestionBox.style.display = 'none'; return; }
    const filtered = SANTRI_LIST.filter(s => s.toLowerCase().includes(query.toLowerCase()));
    suggestionBox.innerHTML = '';
    if (filtered.length === 0) { suggestionBox.style.display = 'none'; return; }
    filtered.forEach(item => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';
      div.textContent = item;
      div.addEventListener('click', () => {
        searchInput.value = item;
        suggestionBox.style.display = 'none';
      });
      suggestionBox.appendChild(div);
    });
    suggestionBox.style.display = 'block';
  }

  async function addSantriDelay() {
    if (!currentUser) { alert('Silakan login terlebih dahulu!'); return; }
    const raw = searchInput.value.trim();
    if (!raw) { alert('Masukkan nama santri.'); return; }
    
    const { nama, kelas } = parseSantri(raw);
    const payload = {
      action: 'add',
      data: {
        type: 'santri',
        nama: nama,
        kelas: kelas,
        timestamp: new Date().toISOString(),
        user: currentUser
      }
    };

    searchInput.value = '';
    await sendData(payload);
  }

  async function addWaliDelay() {
    if (!currentUser) { alert('Silakan login terlebih dahulu!'); return; }
    const waliKelas = waliKelasSelect.value;
    if (waliKelas === '-') { alert('Pilih nama wali kelas terlebih dahulu.'); return; }

    const payload = {
      action: 'add',
      data: {
        type: 'wali',
        waliKelas: waliKelas,
        timestamp: new Date().toISOString(),
        user: currentUser
      }
    };

    waliKelasSelect.selectedIndex = 0;
    await sendData(payload);
  }

  loginBtn.addEventListener('click', () => {
    const user = usernameSelect.value;
    const pass = passwordInput.value.trim();
    if (!user) { alert('Silakan pilih nama user terlebih dahulu!'); return; }
    if (authenticate(user, pass)) {
      currentUser = user;
      loginStatus.innerHTML = `<i class="fas fa-check-circle" style="color:#1e8c4a;"></i> Login: ${user}`;
      alert(`Selamat datang, ${user}!`);
    } else {
      alert('Password salah.');
    }
  });

  searchInput.addEventListener('input', (e) => showSuggestions(e.target.value));
  addSantriDelayBtn.addEventListener('click', addSantriDelay);
  addWaliDelayBtn.addEventListener('click', addWaliDelay);
  refreshBtn.addEventListener('click', loadRecords);

  exportBtn.addEventListener('click', () => {
    if (records.length === 0) { alert('Tidak ada data.'); return; }
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(records);
    XLSX.utils.book_append_sheet(wb, ws, 'Rekapitulasi');
    XLSX.writeFile(wb, `rekap_keterlambatan.xlsx`);
  });

  loadRecords();
</script>
