<html lang="id">

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app-container {
      max-width: 1300px;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 28px 30px;
      box-shadow: 0 20px 40px rgba(0,20,50,0.08);
      height: fit-content;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #0b2b4a;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 i { color: #2a7de1; }
    .login-box {
      background: #eef3fa;
      border-radius: 60px;
      padding: 8px 18px 8px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 18px;
      margin-bottom: 25px;
    }
    .login-box label { font-weight: 500; color: #1a3a5c; }
    .login-box input {
      border: none;
      background: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 14px;
      min-width: 150px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .login-box button {
      background: #1f4e8c;
      border: none;
      color: white;
      padding: 8px 24px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-box button:hover { background: #133b66; }
    .login-status {
      margin-left: auto;
      font-size: 14px;
      color: #1e6b3b;
      background: #d9f0e3;
      padding: 4px 18px;
      border-radius: 40px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 25px;
      background: #f9fcff;
      padding: 18px 20px;
      border-radius: 24px;
      margin: 20px 0 25px 0;
      border: 1px solid #e4ecf5;
      align-items: center;
    }
    .toolbar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar-item label {
      font-weight: 500;
      color: #1f3b5c;
      font-size: 14px;
    }
    .toolbar-item input, .toolbar-item select {
      padding: 8px 12px;
      border-radius: 30px;
      border: 1px solid #d0ddee;
      background: white;
      font-size: 14px;
    }
    .btn-primary {
      background: #1f4e8c;
      border: none;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover { background: #133b66; }
    .btn-outline {
      background: transparent;
      border: 1px solid #1f4e8c;
      color: #1f4e8c;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-outline:hover { background: #e6effa; }
    .btn-success {
      background: #1f8c5a;
      border: none;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
    }
    .input-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: white;
      padding: 5px 12px 5px 18px;
      border-radius: 60px;
      border: 1px solid #d0ddee;
    }
    .input-group input {
      border: none;
      padding: 10px 0;
      min-width: 180px;
      font-size: 14px;
      background: transparent;
    }
    .input-group input:focus { outline: none; }
    .input-group button {
      background: #1f4e8c;
      border: none;
      color: white;
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
    }
    .suggestion-list {
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      max-height: 200px;
      overflow-y: auto;
      margin-top: 6px;
      border: 1px solid #e0eaf5;
      display: none;
      position: absolute;
      width: 100%;
      z-index: 10;
    }
    .suggestion-item {
      padding: 10px 18px;
      cursor: pointer;
      border-bottom: 1px solid #f0f4fa;
    }
    .suggestion-item:hover { background: #eaf1fb; }
    .table-wrapper {
      overflow-x: auto;
      border-radius: 20px;
      border: 1px solid #e4ecf5;
      margin: 20px 0;
      background: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      background: #f2f8ff;
      color: #1b3b5c;
      padding: 14px 12px;
      text-align: left;
      border-bottom: 2px solid #d7e3f0;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid #e9eff6;
    }
    tr:last-child td { border-bottom: none; }
    .badge {
      background: #dce8f8;
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      margin: 10px 0 5px 0;
    }
    .stat {
      font-size: 14px;
      color: #1d3d61;
      background: #eaf2fc;
      padding: 4px 18px;
      border-radius: 30px;
    }
    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }
    .hidden { display: none; }
    .relative { position: relative; }
    @media (max-width: 700px) {
      .app-container { padding: 16px; }
      .login-box { flex-direction: column; align-items: stretch; }
      .login-status { margin-left: 0; text-align: center; }
    }
  </style>
</head>
<body>
<div class="app-container" id="app">
  <h1><i class="fas fa-clock"></i> Pencatatan Keterlambatan Santri</h1>

  <!-- LOGIN -->
  <div class="login-box" id="loginArea">
    <label><i class="fas fa-user"></i> User</label>
    <input type="text" id="usernameInput" placeholder="Nama user" value="Agus Sarkawi">
    <label><i class="fas fa-lock"></i> Password</label>
    <input type="password" id="passwordInput" placeholder="Password">
    <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
    <span class="login-status" id="loginStatus"><i class="fas fa-circle" style="color:#b0c6dd;font-size:10px;"></i> Belum login</span>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-item relative" style="flex:2;min-width:240px;">
      <label><i class="fas fa-plus-circle"></i> Tambah telat</label>
      <div style="position:relative;width:100%;">
        <div class="input-group" style="width:100%;">
          <input type="text" id="searchSantriInput" placeholder="Cari nama santri..." autocomplete="off">
          <button id="addDelayBtn"><i class="fas fa-check"></i> Catat</button>
        </div>
        <div id="suggestionBox" class="suggestion-list"></div>
      </div>
    </div>
    <div class="toolbar-item">
      <label><i class="fas fa-calendar-alt"></i> Filter</label>
      <select id="filterType">
        <option value="all">Semua</option>
        <option value="week">Pekan ini</option>
        <option value="month">Bulan ini</option>
        <option value="custom">Rentang</option>
      </select>
    </div>
    <div class="toolbar-item" id="customRange" style="display:none;">
      <input type="date" id="dateFrom">
      <span>s/d</span>
      <input type="date" id="dateTo">
      <button class="btn-outline" id="applyCustomFilter" style="padding:6px 16px;">Terapkan</button>
    </div>
    <div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn-primary" id="exportXLSBtn"><i class="fas fa-file-excel"></i> Download XLS</button>
    </div>
  </div>

  <!-- STATS & TABLE -->
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 6px 0;">
    <span class="stat"><i class="fas fa-users"></i> Total tercatat: <span id="totalCount">0</span></span>
    <span class="stat"><i class="fas fa-user-clock"></i> Periode ini: <span id="periodCount">0</span></span>
  </div>
  <div class="table-wrapper">
    <table>
      <thead><tr><th>#</th><th>Nama Santri</th><th>Kelas</th><th>Tanggal & Waktu</th><th>Dicatat oleh</th></tr></thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </div>
  <div class="footer-actions">
    <div><i class="fas fa-info-circle" style="color:#527a9e;"></i> Data otomatis tersimpan di Google Sheets</div>
    <button class="btn-outline" id="refreshBtn"><i class="fas fa-sync"></i> Refresh data</button>
  </div>
</div>

    // ========== FUNGSI BANTU ==========
    function authenticate(username, password) {
      const found = USER_LIST.find(u => u.username.toLowerCase() === username.toLowerCase());
      if (!found) return false;
      
      // Validasi password = nama hari + 212
      const hariList = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
      let valid = false;
      for (let h of hariList) {
        if (password === h + '212') {
          valid = true;
          break;
        }
      }
      return valid && (found.password === password);
    }

    function parseSantri(full) {
      const match = full.match(/^(.*?)\s*\(([^)]+)\)$/);
      if (match) {
        return { nama: match[1].trim(), kelas: match[2].trim() };
      }
      return { nama: full.trim(), kelas: '-' };
    }

    function genId() { 
      return Date.now() + '_' + Math.random().toString(36).substring(2,6); 
    }

    // ========== LOAD / SAVE ==========
    function loadRecords() {
      try {
        const stored = localStorage.getItem('delayRecords');
        if (stored) {
          records = JSON.parse(stored);
          records = records.map(r => ({ ...r, id: r.id || genId() }));
        } else {
          records = [];
          // Data dummy untuk demo
          //const dummyData = [
          //  { nama: "Ahmad Musa", kelas: "7a", timestamp: new Date(Date.now() - 3600000).toISOString(), user: "Agus Sarkawi" },
           // { nama: "Ari", kelas: "7a", timestamp: new Date(Date.now() - 7200000).toISOString(), user: "Adi Hardiyansyah" },
           // { nama: "Muhammad Fan", kelas: "7a", timestamp: new Date(Date.now() - 86400000).toISOString(), user: "Arsyad" }
          //];
          //records = dummyData.map(r => ({ ...r, id: genId() }));
          saveRecords();
        }
      } catch(e) { 
        records = []; 
      }
      applyFilter();
    }

    function saveRecords() {
      localStorage.setItem('delayRecords', JSON.stringify(records));
      console.log('Data tersimpan di localStorage. Link Google Sheets: https://docs.google.com/spreadsheets/d/1occnPaHwae-FWxNiD75LwKX_LbKtFy_EYYnaGYfuqts/edit?usp=drivesdk');
    }

    // ========== FILTER ==========
    function applyFilter() {
      const filter = filterType.value;
      const now = new Date();
      let from, to;

      if (filter === 'week') {
        const day = now.getDay();
        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
        from = new Date(now.getFullYear(), now.getMonth(), diff);
        from.setHours(0,0,0,0);
        to = new Date(from);
        to.setDate(to.getDate() + 6);
        to.setHours(23,59,59,999);
        filteredRecords = records.filter(r => {
          const d = new Date(r.timestamp);
          return d >= from && d <= to;
        });
      } else if (filter === 'month') {
        from = new Date(now.getFullYear(), now.getMonth(), 1);
        from.setHours(0,0,0,0);
        to = new Date(now.getFullYear(), now.getMonth()+1, 0);
        to.setHours(23,59,59,999);
        filteredRecords = records.filter(r => {
          const d = new Date(r.timestamp);
          return d >= from && d <= to;
        });
      } else if (filter === 'custom') {
        if (dateFrom.value && dateTo.value) {
          from = new Date(dateFrom.value); 
          from.setHours(0,0,0,0);
          to = new Date(dateTo.value); 
          to.setHours(23,59,59,999);
          filteredRecords = records.filter(r => {
            const d = new Date(r.timestamp);
            return d >= from && d <= to;
          });
        } else {
          filteredRecords = [...records];
        }
      } else {
        filteredRecords = [...records];
      }
      updateTable();
    }

    function updateTable() {
      const tbody = recordsBody;
      tbody.innerHTML = '';
      const list = filteredRecords.length ? filteredRecords : records;
      totalCount.textContent = records.length;
      periodCount.textContent = list.length;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:30px;color:#7a94b5;">Belum ada data keterlambatan</td></tr>`;
        return;
      }

      list.slice().reverse().forEach((r, idx) => {
        const tr = document.createElement('tr');
        const no = list.length - idx;
        const dateObj = new Date(r.timestamp);
        const dateStr = dateObj.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
        const timeStr = dateObj.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
        tr.innerHTML = `
          <td>${no}</td>
          <td><strong>${r.nama}</strong></td>
          <td><span class="badge">${r.kelas || '-'}</span></td>
          <td>${dateStr} ${timeStr}</td>
          <td>${r.user || 'system'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ========== SUGGESTION ==========
    function showSuggestions(query) {
      if (!query.trim()) { 
        suggestionBox.style.display = 'none'; 
        return; 
      }
      const q = query.toLowerCase();
      const filtered = SANTRI_LIST.filter(s => s.toLowerCase().includes(q));
      suggestionBox.innerHTML = '';
      if (filtered.length === 0) {
        suggestionBox.style.display = 'none';
        return;
      }
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.textContent = item;
        div.addEventListener('click', () => {
          searchInput.value = item;
          suggestionBox.style.display = 'none';
        });
        suggestionBox.appendChild(div);
      });
      suggestionBox.style.display = 'block';
    }

    // ========== TAMBAH DELAY ==========
    function addDelay() {
      if (!currentUser) {
        alert('Silakan login terlebih dahulu!');
        return;
      }
      const raw = searchInput.value.trim();
      if (!raw) { 
        alert('Masukkan nama santri.'); 
        return; 
      }
      const santri = SANTRI_LIST.find(s => s.toLowerCase() === raw.toLowerCase());
      if (!santri) {
        alert('Nama santri tidak ditemukan dalam daftar. Periksa penulisan.');
        return;
      }
      const { nama, kelas } = parseSantri(santri);
      const newRecord = {
        id: genId(),
        nama: nama,
        kelas: kelas,
        timestamp: new Date().toISOString(),
        user: currentUser
      };
      records.push(newRecord);
      saveRecords();
      searchInput.value = '';
      suggestionBox.style.display = 'none';
      applyFilter();
    }

    // ========== EXPORT XLS ==========
    function exportXLS() {
      const data = filteredRecords.length ? filteredRecords : records;
      if (data.length === 0) {
        alert('Tidak ada data untuk diekspor.');
        return;
      }
      const exportData = data.map((r, idx) => ({
        'No': idx+1,
        'Nama': r.nama,
        'Kelas': r.kelas || '-',
        'Tanggal': new Date(r.timestamp).toLocaleDateString('id-ID'),
        'Waktu': new Date(r.timestamp).toLocaleTimeString('id-ID'),
        'Dicatat Oleh': r.user || 'system'
      }));
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(exportData);
      XLSX.utils.book_append_sheet(wb, ws, 'Keterlambatan');
      XLSX.writeFile(wb, `rekap_keterlambatan_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // ========== LOGIN ==========
    function doLogin() {
      const user = usernameInput.value.trim();
      const pass = passwordInput.value.trim();
      if (!user || !pass) { 
        alert('Masukkan username dan password'); 
        return; 
      }
      if (authenticate(user, pass)) {
        currentUser = user;
        loginStatus.innerHTML = `<i class="fas fa-check-circle" style="color:#1e8c4a;"></i> Login sebagai ${user}`;
        loginStatus.style.background = '#d9f0e3';
        alert(`Selamat datang, ${user}`);
      } else {
        alert('Login gagal. Periksa username dan password (password = nama hari+212)');
      }
    }

    // ========== INIT ==========
    function init() {
      loadRecords();

      loginBtn.addEventListener('click', doLogin);
      passwordInput.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') doLogin(); 
      });

      searchInput.addEventListener('input', (e) => {
        showSuggestions(e.target.value);
      });
      searchInput.addEventListener('blur', () => {
        setTimeout(() => { suggestionBox.style.display = 'none'; }, 200);
      });
      searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim()) showSuggestions(searchInput.value);
      });

      addDelayBtn.addEventListener('click', addDelay);
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addDelay();
        }
      });

      filterType.addEventListener('change', () => {
        if (filterType.value === 'custom') {
          customRange.style.display = 'flex';
          const now = new Date();
          const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
          dateFrom.value = firstDay.toISOString().slice(0,10);
          dateTo.value = now.toISOString().slice(0,10);
        } else {
          customRange.style.display = 'none';
        }
        applyFilter();
      });

      applyCustomFilter.addEventListener('click', () => {
        if (dateFrom.value && dateTo.value) {
          applyFilter();
        } else alert('Pilih rentang tanggal.');
      });

      exportBtn.addEventListener('click', exportXLS);

      refreshBtn.addEventListener('click', () => {
        loadRecords();
        alert('Data diperbarui dari penyimpanan.');
      });

      // Inisialisasi custom range
      const now = new Date();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
      dateFrom.value = firstDay.toISOString().slice(0,10);
      dateTo.value = now.toISOString().slice(0,10);

      filterType.value = 'all';
      customRange.style.display = 'none';
      applyFilter();

      console.log(`Total santri terdaftar: ${SANTRI_LIST.length} orang`);
    }

    document.addEventListener('DOMContentLoaded', init);

// ============= LOAD DATA DARI GOOGLE SHEETS =============
async function loadRecordsFromSheet() {
  try {
    const response = await fetch(`${API_URL}?action=get`);
    const data = await response.json();
    
    if (Array.isArray(data)) {
      records = data.map(row => ({
        id: row['ID'] || Date.now(),
        nama: row['Nama Santri'] || '',
        kelas: row['Kelas'] || '',
        timestamp: row['Timestamp'] || new Date().toISOString(),
        user: row['Dicatat Oleh'] || 'system'
      }));
      saveRecordsToLocal(); // Backup ke localStorage

    console.error('Gagal load data:', error);

  }

// ============= SAVE DATA KE GOOGLE SHEETS =============
async function saveRecordsToSheet(record) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'add',
        data: {
          nama: record.nama,
          kelas: record.kelas,
          timestamp: record.timestamp,
          user: record.user
        }
      })
    });
    
    // Karena mode no-cors, kita tidak bisa membaca response
    // Tapi data tetap terkirim
    console.log('Data terkirim ke Google Sheets');
    return true;
  } catch (error) {
    console.error('Gagal kirim data:', error);
    return false;
  }
}

  try {
    await fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'delete',
        data: { id: id }
      })
    });
    console.log('Data dihapus dari Google Sheets');
    return true;
  } catch (error) {
